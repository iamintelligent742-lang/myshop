<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mera Product Order Page</title>
    <style>
        * { box-sizing: border-box; }
        
        body { 
            font-family: Arial, sans-serif; 
            background-color: #f4f4f9; 
            padding: 15px; 
            margin: 0;
        }
        
        /* margin: 20px auto; add kiya taaki 2 products ke beech jagah (gap) bane */
        .product-card { 
            background-color: white; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
            margin: 20px auto; /* 20px top-bottom gap ke liye */
            padding: 20px; 
            text-align: center; 
        }
        
        input, textarea, button { 
            width: 100%; 
            margin-top: 12px; 
            padding: 12px; 
            border: 1px solid #ccc; 
            border-radius: 5px; 
            font-size: 16px; 
        }
        
        button { background-color: #28a745; color: white; font-weight: bold; border: none; cursor: pointer; }
        button:hover { background-color: #218838; }
        .statusMessage { margin-top: 15px; font-weight: bold; }
        
        .qty-section { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
        .qty-section label { font-weight: bold; color: #333; }
        .qty-section input { width: 80px; margin-top: 0; }
        
        .product-img {
            width: 100%;            
            height: auto;           
            object-fit: contain;     
            border-radius: 8px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <!-- ================= PRODUCT 1 ================= -->
    <div class="product-card">
        <img src="D:\1.png" alt="Smart Watch" class="product-img">
        <h2>Kalamkari lehenga set</h2>
        <p>Dola Silk Foil Printed Lehenga choli with Amazing Dupatta.</p>
        
        <!-- Yahan id hata kar class="orderForm" lagaya hai -->
        <form class="orderForm">
            <input type="text" class="custName" placeholder="Aapka Pura Naam" required>
            <input type="tel" class="custNumber" placeholder="Mobile Number" required maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <textarea class="custAddress" placeholder="Delivery Address" rows="3" required></textarea>
            
            <input type="hidden" class="productName" value="https://ltl.sh/share/cnodtdm2gw?external_product_id=9k3gt0&product_name=product&pid=product_share&c=product_share&shared_by=NTE0NzU3NDk4&utm_source=share_095c5c2bb777260272e85f41fd35fa5f30acc34e3d0e7a1dba6d98f472551860">
            
            <div class="qty-section">
                <label>Quantity</label>
                <input type="number" class="productQty" min="1" value="1" required>
            </div>
            
            <button type="submit" class="submitBtn">Order Now</button>
        </form>
        <p class="statusMessage"></p>
    </div>
    <!-- ================= PRODUCT 1 END ================= -->


    <!-- ================= PRODUCT 2 ================= -->
    <div class="product-card">
        <img src="D:\2.png" alt="Earbuds" class="product-img">
        <h2>Wireless Earbuds</h2>
        <p>Best bass aur clear sound wale wireless earbuds.</p>
        
        <form class="orderForm">
            <input type="text" class="custName" placeholder="Aapka Pura Naam" required>
            <input type="tel" class="custNumber" placeholder="Mobile Number" required maxlength="10" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
            <textarea class="custAddress" placeholder="Delivery Address" rows="3" required></textarea>
            
            <!-- Isme Value badal kar Earbuds kar di hai -->
            <input type="hidden" class="productName" value="ID = 0002">
            
            <div class="qty-section">
                <label>Quantity</label>
                <input type="number" class="productQty" min="1" value="1" required>
            </div>
            
            <button type="submit" class="submitBtn">Order Now</button>
        </form>
        <p class="statusMessage"></p>
    </div>
    <!-- ================= PRODUCT 2 END ================= -->


    <!-- JAVASCRIPT ME BHI CHHOTA SA JADU KIYA HAI -->
    <script>
        // querySelectorAll se hum page ke sabhi forms ko ek sath select kar rahe hain
        const allForms = document.querySelectorAll('.orderForm');

        allForms.forEach(form => {
            form.addEventListener('submit', function(e) {
                e.preventDefault(); 

                // Ab hum form ke ANDAR wali classes ko dhundhenge
                const numVal = form.querySelector('.custNumber').value;
                if(numVal.length < 10) {
                    alert("Mobile number 10 digit ka hona chahiye!");
                    return;
                }

                const btn = form.querySelector('.submitBtn');
                // Form ke theek baad wale status message ko select karenge
                const statusMsg = form.nextElementSibling; 
                btn.innerText = "Bhej raha hai...";

                const customerData = {
                    name: form.querySelector('.custName').value,
                    number: numVal,
                    address: form.querySelector('.custAddress').value,
                    product: form.querySelector('.productName').value, // Har form apna product naam khud uthayega
                    quantity: form.querySelector('.productQty').value
                };

                const scriptURL = 'https://script.google.com/macros/s/AKfycbyQVSvVAuD4Z7g54WAn9spnnL5ev0eLbYeHJmTA0x29SZITGzJcgIH9yJs_q0q_W_kx/exec';

                fetch(scriptURL, {
                    method: 'POST',
                    body: JSON.stringify(customerData),
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' }
                })
                .then(response => {
                    statusMsg.style.color = "green";
                    statusMsg.innerText = "Order Successfully Done!";
                    form.reset(); 
                    btn.innerText = "Order Bhejein";
                })
                .catch(error => {
                    statusMsg.style.color = "red";
                    statusMsg.innerText = "Kuch error aagaya!";
                    btn.innerText = "Order Bhejein";
                });
            });
        });
    </script>
</body>
</html>
